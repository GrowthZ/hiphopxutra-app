# Media Worker: `cd worker && npx wrangler deploy` (see HUONG-DAN-CHAY.md, mục Ảnh)
name = "hiphopxutra-media"
main = "src/index.js"
compatibility_date = "2025-06-01"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hiphopxutra"

[vars]
FIREBASE_PROJECT_ID = "hiphopxutra2026"
EVENT_ID = "hiphopxutra-2026"
# Pages allowed to upload (comma separated); localhost is always allowed for development.
ALLOWED_ORIGINS = "https://hiphopxutra.vercel.app"
